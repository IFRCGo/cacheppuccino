name: ci

on:
  push:
    branches: ["develop"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (vet, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Verify gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needed on:"
            echo "$files"
            exit 1
          fi

      - name: Tidy check (no diff)
        run: |
          go mod tidy
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o cacheppuccino .

  docker:
    name: docker (build and push)
    runs-on: ubuntu-latest
    needs: [go]

    permissions:
      contents: read
      packages: write

    outputs:
      docker_image_tag: ${{ steps.meta.outputs.version }}
      docker_image_name: ${{ steps.ver.outputs.image_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=0.1.0-c
            type=ref,event=tag

      - name: Determine build version
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Tag format: v0.1.0 -> 0.1.0
            VERSION="${GITHUB_REF_NAME#v}"
          else
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            VERSION="0.1.0-c${SHORT_SHA}"
          fi

          # GHCR rejects an uppercase path, and this repository owner has one.
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  helm:
    name: helm (package and push)
    runs-on: ubuntu-latest
    needs: [docker]
    # if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write
      # Resolving the PR behind the built commit, for the pr-* annotations.
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Determine chart version
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Tag format: v0.1.0 -> 0.1.0
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Unique semver prerelease for main pushes
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            VERSION="0.1.0-c${SHORT_SHA}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR (Helm OCI)
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Lint chart
        run: helm lint helm

      - name: 🐳 Helm template (snapshot)
        run: ./helm/update-snapshots.sh --check-diff-only

      - name: Tag docker image in Helm Chart values.yaml
        working-directory: helm
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.docker_image_tag }}
        run: |
          # Update values.yaml with latest docker image
          sed -i "s/SET-BY-CICD-TAG/$IMAGE_TAG/" ./values.yaml

      - name: Write provenance annotations to Helm Chart values.yaml
        working-directory: helm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.docker.outputs.docker_image_name }}
          IMAGE_TAG: ${{ needs.docker.outputs.docker_image_tag }}
        run: |
          set -euo pipefail

          # Ingress annotations, read off the live object by the Togglecorp
          # dashboard. Runs after the snapshot check so the injected values
          # never show up as a snapshot diff.
          ANNOTATIONS_PATH=".ingress.annotations"

          # Fail loudly if the chart does not follow the expected convention,
          # rather than letting yq silently create a bogus nested tree.
          PARENT="${ANNOTATIONS_PATH%.*}"
          if ! yq -e "$PARENT" values.yaml >/dev/null 2>&1; then
            echo "::error::annotations path parent '$PARENT' does not exist in values.yaml."
            exit 1
          fi

          # -- Provenance values (exported so yq strenv() can read them safely) --
          export SCHEMA_VERSION="1"
          export REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          export COMMIT="${GITHUB_SHA}"
          export REF="${GITHUB_REF_NAME}"
          export REF_TYPE="${GITHUB_REF_TYPE}"
          export DATETIME COMMIT_MESSAGE
          DATETIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The chart runs `tpl` over annotation values, so a literal `{{` in a
          # commit subject would fail the render at deploy time rather than
          # here. Escape it to the Go-template literal that renders back to it.
          COMMIT_MESSAGE="$(git log -1 --pretty=%s | sed 's/{{/{{ "{{" }}/g')"
          export IMAGE_LABEL="${IMAGE_TAG}"
          export IMAGE_URL="${IMAGE_NAME}:${IMAGE_TAG}"
          export ACTOR="${GITHUB_ACTOR}"
          export ACTOR_IMAGE_URL="https://github.com/${GITHUB_ACTOR}.png"
          export CI_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          export REPO_OWNER_IMAGE_URL="https://github.com/${GITHUB_REPOSITORY_OWNER}.png"

          P="$ANNOTATIONS_PATH"
          A="web-app-serve.togglecorp.com"
          EXPR="${P}.\"${A}/schema-version\" = strenv(SCHEMA_VERSION)"
          EXPR="${EXPR} | ${P}.\"${A}/repo-url\" = strenv(REPO_URL)"
          EXPR="${EXPR} | ${P}.\"${A}/ref\" = strenv(REF)"
          EXPR="${EXPR} | ${P}.\"${A}/ref-type\" = strenv(REF_TYPE)"
          EXPR="${EXPR} | ${P}.\"${A}/commit\" = strenv(COMMIT)"
          EXPR="${EXPR} | ${P}.\"${A}/commit-message\" = strenv(COMMIT_MESSAGE)"
          EXPR="${EXPR} | ${P}.\"${A}/datetime\" = strenv(DATETIME)"
          EXPR="${EXPR} | ${P}.\"${A}/image-label\" = strenv(IMAGE_LABEL)"
          EXPR="${EXPR} | ${P}.\"${A}/image-url\" = strenv(IMAGE_URL)"
          EXPR="${EXPR} | ${P}.\"${A}/actor\" = strenv(ACTOR)"
          EXPR="${EXPR} | ${P}.\"${A}/actor-image-url\" = strenv(ACTOR_IMAGE_URL)"
          EXPR="${EXPR} | ${P}.\"${A}/repo-owner-image-url\" = strenv(REPO_OWNER_IMAGE_URL)"
          EXPR="${EXPR} | ${P}.\"${A}/ci-run-url\" = strenv(CI_RUN_URL)"

          # helm publishes on push and on tags, neither of which carries a PR
          # context, so the PR is resolved from the commit. The keys are
          # omitted when there is none. A failed API call is surfaced rather
          # than read as "no PR", so a missing scope stays diagnosable.
          if PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0] // empty' 2>/tmp/gh_pr_err)"; then
            if [ -n "$PR_JSON" ]; then
              export PR_NUMBER PR_AUTHOR PR_AUTHOR_IMAGE_URL
              PR_NUMBER="$(echo "$PR_JSON" | jq -r '.number')"
              PR_AUTHOR="$(echo "$PR_JSON" | jq -r '.user.login')"
              PR_AUTHOR_IMAGE_URL="https://github.com/${PR_AUTHOR}.png"
              EXPR="${EXPR} | ${P}.\"${A}/pr-number\" = strenv(PR_NUMBER)"
              EXPR="${EXPR} | ${P}.\"${A}/pr-author\" = strenv(PR_AUTHOR)"
              EXPR="${EXPR} | ${P}.\"${A}/pr-author-image-url\" = strenv(PR_AUTHOR_IMAGE_URL)"
            else
              echo "::notice::No PR associated with ${GITHUB_SHA}; skipping pr-* annotations."
            fi
          else
            echo "::warning::Could not query PRs for ${GITHUB_SHA} (does the token have 'pull-requests: read'?); skipping pr-* annotations. $(cat /tmp/gh_pr_err)"
          fi

          yq -i "$EXPR" values.yaml

          echo "Wrote provenance annotations under ${P}:"
          yq "${P}" values.yaml

      - name: Package chart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package helm \
            --destination dist \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}"

      - name: Push chart to GHCR (OCI)
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          OCI_REPO="oci://ghcr.io/${OWNER_LC}"
          PACKAGE_FILE="$(ls -1 dist/cacheppuccino-*.tgz | head -n 1)"
          IMAGE="${{ needs.docker.outputs.docker_image_tag }}"

          # Add GitHub Actions summary
          echo "# Helm Chart" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          helm push "$PACKAGE_FILE" "$OCI_REPO" 2>> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
