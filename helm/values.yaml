enabled: true

# Three replicas tolerate one node drain while leaving a warm peer for a new
# pod to hydrate from.
replicaCount: 3

# maxUnavailable 0 keeps a warm pod serving until a new one reports ready,
# and a new pod only reports ready once it holds servable translations.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

image:
  repository: ghcr.io/ifrcgo/cacheppuccino
  tag: 'SET-BY-CICD-TAG'
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  # Pod-to-pod traffic (peer hydration). Published only on the headless
  # Service, never through the ingress.
  internalPort: 8081

# Headless Service for peer discovery. publishNotReadyAddresses keeps a
# broken pod visible in /cluster, which is when you most want to see it.
headlessService:
  enabled: true
  publishNotReadyAddresses: true

ingress:
  enabled: false
  className: ""
  # Rendered onto Ingress.metadata.annotations. A string value is
  # tpl-evaluated, so it can reference release data; any other value renders as
  # JSON. Either way the value lands as the string Kubernetes requires, and a
  # null value drops its key.
  #
  # CI writes deployment provenance here as `web-app-serve.togglecorp.com/*`
  # keys (commit, ref, PR, image, actor, run URL), which the Togglecorp
  # dashboard reads off the live Ingress. That write is a yq path assignment
  # into this file, so the block has to exist here or the CI step fails.
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""

# Sized from a measurement of the production export (2026-09-17): 0.7 MiB
# XLSX, 26,578 rows, 6.4 MiB per live snapshot, ~12.8 MiB while an import
# holds the old one alongside the new, 87 MiB peak RSS. The limit leaves
# roughly 5x headroom over that peak; re-measure with
# `MEASURE_REAL=1 go test -run TestMeasureRealExport` before changing it.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Liveness reports the process; readiness reports whether this pod holds
# servable translations. The startup probe gives the first hydration room
# without letting liveness restart a pod that is merely still starting.
probes:
  startup:
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

# Endpoint removal propagates asynchronously, so the pod keeps serving for a
# moment after it is told to stop. Without this, a rolling deploy drops the
# requests it is meant to protect.
terminationGracePeriodSeconds: 45
preStopSleepSeconds: 10

podDisruptionBudget:
  enabled: true
  # Expressed as maxUnavailable so it stays satisfiable at any replicaCount:
  # minAvailable: 2 blocks every drain forever once replicas drop to 1 or 2.
  # One at a time also always leaves a warm peer to hydrate from.
  maxUnavailable: 1

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  # ScheduleAnyway so a small cluster can still place all replicas.
  whenUnsatisfiable: ScheduleAnyway

# Leader election needs get/create/update on one Lease in this namespace.
rbac:
  create: true

# Disabled: availability is what replicas buy today, not throughput. Safe to
# enable once several applications share these pods.
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Snapshot cache on an emptyDir: it only has to survive container restarts
# within a pod. Peer hydration covers rescheduling, rollouts and drains, so
# there is no PersistentVolume and no storage class to get wrong.
cache:
  enabled: true
  mountPath: /cache
  sizeLimit: 256Mi

# INTERNAL_LISTEN_ADDR is not listed here: the ConfigMap derives it from
# service.internalPort so the two cannot drift.
env:
  LISTEN_ADDR: ":8080"
  LOG_LEVEL: "info"
  # api: pull from the IFRC translation service (needs TRANSLATION_BASE_URL,
  #      TRANSLATION_APPLICATION_ID and the TRANSLATION_API_KEY secret).
  # url: pull a plain XLSX file from TRANSLATION_XLSX_URL (QA/alpha mock).
  TRANSLATION_SOURCE: "api"
  TRANSLATION_BASE_URL: ""
  TRANSLATION_APPLICATION_ID: ""
  PULL_INTERVAL: "10m"
  PULL_CONCURRENCY: "4"
  HTTP_TIMEOUT: "30s"
  INITIAL_PULL_DEADLINE: "45s"
  # Retry fast until the first successful hydration: waiting a whole pull
  # interval after a transient failure would stall a rollout.
  INITIAL_PULL_BACKOFF_MIN: "2s"
  INITIAL_PULL_BACKOFF_MAX: "30s"

  # Discarded beyond MAX_CACHE_AGE so a long-restarted pod does not quietly
  # serve content the rest of the fleet has moved past.
  MAX_CACHE_AGE: "24h"

  # How quickly a follower notices the primary has new content.
  PEER_POLL_INTERVAL: "5s"
  PEER_TIMEOUT: "3s"

  LEADER_ELECTION: "lease"
  LEASE_DURATION: "15s"
  LEASE_RENEW_INTERVAL: "5s"

  # Fleet alarms for /monitor. These raise an alert; none of them can make a
  # pod unready.
  # Normal failover is seconds, so anything sustained means RBAC or the API
  # server is broken.
  ALARM_NO_PRIMARY: "5m"
  # Empty derives 4x PULL_INTERVAL, which follows a shortened interval
  # instead of ignoring it.
  ALARM_SNAPSHOT_AGE: ""
  # Brief divergence while a new snapshot propagates is normal.
  ALARM_DIVERGENCE: "2m"
  ALARM_PEER_UNREADY: "2m"
  ALARM_PULL_FAILURES: "3"

  CLUSTER_CACHE_TTL: "5s"

secrets: {}

# Additional envFrom sources this chart does not create. Both are referenced
# after the chart's own Secret and ConfigMap, so a key defined here wins.
#
# A change to either does not roll the pods on its own: checksum/config covers
# only the ConfigMap this chart renders. The Deployment's reloader annotation
# covers these too wherever that controller is installed.
extraConfigMapName: ""
extraSecretsName: ""

# Azure Key Vault CSI Driver
secretsStoreCsiDriver:
  enabled: false
  provider: azure

  # optional overrides
  secretProviderClassName: ""
  secretName: ""

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: ""
    keyvaultName: ""
    tenantId: ""
  secretsKeyMap: {}
    # TRANSLATION_API_KEY: "TRANSLATION-API-KEY"
