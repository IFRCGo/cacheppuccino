apiVersion: v1
kind: Service
metadata:
  name: release-name-cacheppuccino-helm-headless
  labels:
    helm.sh/chart: cacheppuccino-helm-0.1.0
    app.kubernetes.io/name: cacheppuccino-helm
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "0.1.0"
