# Source: cacheppuccino-helm/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-cacheppuccino-helm
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    helm.sh/chart: cacheppuccino-helm-0.1.0
    app.kubernetes.io/name: cacheppuccino-helm
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cacheppuccino-helm
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cacheppuccino-helm
        app.kubernetes.io/instance: release-name
    spec:
      serviceAccountName: release-name-cacheppuccino-helm
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cacheppuccino
          image: "ghcr.io/ifrcgo/cacheppuccino:SET-BY-CICD-TAG"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: internal
              containerPort: 8081
              protocol: TCP
          env:
            # Lease identity and peer identity: a pod has to know which pod
            # it is before it can tell itself apart from its siblings.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: LEASE_NAME
              value: "release-name-cacheppuccino-helm"
            - name: PEER_SERVICE
              value: "release-name-cacheppuccino-helm-headless"
          envFrom:
            - configMapRef:
                name: release-name-cacheppuccino-helm
            - secretRef:
                name: release-name-cacheppuccino-helm-vault-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          lifecycle:
            preStop:
              # Keep serving while endpoint removal propagates to the
              # ingress; shutdown begins only after this returns.
              sleep:
                seconds: 10
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            limits:
              cpu: 2
              memory: 512Mi
            requests:
              cpu: "0.2"
              memory: 512Mi
          volumeMounts:
            - name: cache
              mountPath: "/cache"
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: "256Mi"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cacheppuccino-helm
              app.kubernetes.io/instance: release-name

