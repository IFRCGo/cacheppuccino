spec:
  clusterIP: None
  # Unready pods stay in DNS so a broken pod is still visible on /cluster,
  # which is exactly when you want to see it. Hydration skips peers that
  # report no snapshot.
  publishNotReadyAddresses: true
  ports:
    - name: internal
      port: 8081
      targetPort: internal
      protocol: TCP
  selector:
    app.kubernetes.io/name: cacheppuccino-helm
    app.kubernetes.io/instance: release-name

