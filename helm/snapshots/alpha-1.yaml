# Source: cacheppuccino-helm/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-cacheppuccino-helm
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    helm.sh/chart: cacheppuccino-helm-0.1.0
    app.kubernetes.io/name: cacheppuccino-helm
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cacheppuccino-helm
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cacheppuccino-helm
        app.kubernetes.io/instance: release-name
    spec:
      serviceAccountName: release-name-cacheppuccino-helm
      containers:
        - name: cacheppuccino
          image: "ghcr.io/ifrcgo/cacheppuccino:SET-BY-CICD-TAG"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: release-name-cacheppuccino-helm
            - secretRef:
                name: release-name-cacheppuccino-helm-vault-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            limits:
              cpu: 2
              memory: 512Mi
            requests:
              cpu: "0.2"
              memory: 512Mi
          volumeMounts:
            - name: sqlite
              mountPath: "/data"
      volumes:
        - name: sqlite
          persistentVolumeClaim:
            claimName: release-name-cacheppuccino-helm
---
# Source: cacheppuccino-helm/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: release-name-cacheppuccino-helm
  labels:
    helm.sh/chart: cacheppuccino-helm-0.1.0
