    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  rules:
    - host: "cacheppuccino-alpha-1.ifrc-go.dev.togglecorp.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: release-name-cacheppuccino-helm
                port:
                  number: 8080
