# Source: cacheppuccino-helm/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ifrcgo-cacheppuccino
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    helm.sh/chart: cacheppuccino-helm-0.1.0
    app.kubernetes.io/name: cacheppuccino-helm
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cacheppuccino-helm
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cacheppuccino-helm
        app.kubernetes.io/instance: release-name
        azure.workload.identity/use: "true"
      annotations:
        # Roll the pods when configuration changes. envFrom is read once at
        # container start, so without this a values change reaches the
        # ConfigMap and never reaches a running pod.
        checksum/config: 6df76a73ac25e0e68a3985bee6454e84495f721f976a6168cf89c322e95ba848
    spec:
      serviceAccountName: ifrcgo-cacheppuccino
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cacheppuccino
          image: "ghcr.io/ifrcgo/cacheppuccino:SET-BY-CICD-TAG"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: internal
              containerPort: 8081
              protocol: TCP
          env:
            # Lease identity and peer identity: a pod has to know which pod
            # it is before it can tell itself apart from its siblings.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: LEASE_NAME
              value: "ifrcgo-cacheppuccino"
            - name: PEER_SERVICE
              value: "ifrcgo-cacheppuccino-headless"
          envFrom:
            - secretRef:
                name: ifrcgo-cacheppuccino-vault-secret
            - configMapRef:
                name: ifrcgo-cacheppuccino
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          lifecycle:
            preStop:
              # Keep serving while endpoint removal propagates to the
              # ingress; shutdown begins only after this returns.
              sleep:
                seconds: 10
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: cache
              mountPath: "/cache"
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: "256Mi"
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ifrcgo-cacheppuccino-secret-provider
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cacheppuccino-helm
              app.kubernetes.io/instance: release-name

