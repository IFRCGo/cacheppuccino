# Source: cacheppuccino-helm/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ifrcgo-cacheppuccino
  labels:
    helm.sh/chart: cacheppuccino-helm-0.1.0
    app.kubernetes.io/name: cacheppuccino-helm
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  # Always emitted: an absent CACHE_DIR would fall back to the built-in
  # default path, which has no volume behind it when the cache is disabled.
  CACHE_DIR: "/cache"
  # Derived from the port the container and the headless Service publish, so
  # the listener cannot bind somewhere peers are not looking.
  INTERNAL_LISTEN_ADDR: ":8081"
  ALARM_DIVERGENCE: "2m"
  ALARM_NO_PRIMARY: "5m"
  ALARM_PEER_UNREADY: "2m"
  ALARM_PULL_FAILURES: "3"
  ALARM_SNAPSHOT_AGE: ""
  CLUSTER_CACHE_TTL: "5s"
  HTTP_TIMEOUT: "30s"
  INITIAL_PULL_BACKOFF_MAX: "30s"
  INITIAL_PULL_BACKOFF_MIN: "2s"
  INITIAL_PULL_DEADLINE: "45s"
  LEADER_ELECTION: "lease"
  LEASE_DURATION: "15s"
  LEASE_RENEW_INTERVAL: "5s"
  LISTEN_ADDR: ":8080"
  LOG_LEVEL: "info"
  MAX_CACHE_AGE: "24h"
  PEER_POLL_INTERVAL: "5s"
  PEER_TIMEOUT: "3s"
  PULL_CONCURRENCY: "4"
  PULL_INTERVAL: "10m"
  TRANSLATION_APPLICATION_ID: "18"
  TRANSLATION_BASE_URL: "https://ifrc-test-translationapi.azurewebsites.net"
  TRANSLATION_SOURCE: "api"

