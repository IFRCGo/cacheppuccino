{{- if and .Values.enabled .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cacheppuccino.fullname" . }}-lease
  labels:
    {{- include "cacheppuccino.labels" . | nindent 4 }}
rules:
  # Leader election: one named Lease in this namespace, nothing else.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ include "cacheppuccino.fullname" . | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cacheppuccino.fullname" . }}-lease
  labels:
    {{- include "cacheppuccino.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cacheppuccino.fullname" . }}-lease
subjects:
  - kind: ServiceAccount
    name: {{ include "cacheppuccino.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
