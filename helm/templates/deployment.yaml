{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cacheppuccino.fullname" . }}
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    {{- include "cacheppuccino.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "cacheppuccino.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cacheppuccino.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pods when configuration changes. envFrom is read once at
        # container start, so without this a values change reaches the
        # ConfigMap and never reaches a running pod.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cacheppuccino.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cacheppuccino
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: internal
              containerPort: {{ .Values.service.internalPort }}
              protocol: TCP
          env:
            # Lease identity and peer identity: a pod has to know which pod
            # it is before it can tell itself apart from its siblings.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: LEASE_NAME
              value: {{ include "cacheppuccino.fullname" . | quote }}
            {{- if .Values.headlessService.enabled }}
            - name: PEER_SERVICE
              value: {{ include "cacheppuccino.headlessServiceName" . | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "cacheppuccino.fullname" . }}
            - secretRef:
                name: {{ include "cacheppuccino.secretName" . }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if gt (int .Values.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              # Keep serving while endpoint removal propagates to the
              # ingress; shutdown begins only after this returns.
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.cache.enabled }}
            - name: cache
              mountPath: {{ .Values.cache.mountPath | quote }}
            {{- end }}
            {{- if .Values.secretsStoreCsiDriver.enabled }}
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.cache.enabled }}
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.cache.sizeLimit | quote }}
        {{- end }}
        {{- if .Values.secretsStoreCsiDriver.enabled }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "cacheppuccino.secretProviderName" . }}
        {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "cacheppuccino.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
