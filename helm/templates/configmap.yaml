{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cacheppuccino.fullname" . }}
  labels:
    {{- include "cacheppuccino.labels" . | nindent 4 }}
data:
  {{- if .Values.cache.enabled }}
  CACHE_DIR: {{ .Values.cache.mountPath | quote }}
  {{- end }}
  {{- range $name, $value := .Values.env }}
  {{ $name }}: {{ tpl $value $ | quote }}
  {{- end }}
{{- end }}
