{{- if not .Values.secretsStoreCsiDriver.enabled -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cacheppuccino.secretName" . }}
  labels:
    {{- include "cacheppuccino.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secrets }}
  {{ $name }}: {{ tpl $value $ | quote }}
  {{- end }}

{{- end }}
