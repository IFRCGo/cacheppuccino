services:
  cacheppuccino:
    build: .
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8080:8080"
# user: "0:0"
    environment:
      TRANSLATION_SOURCE: ${TRANSLATION_SOURCE:-api}
      TRANSLATION_BASE_URL: ${TRANSLATION_BASE_URL:-}
      TRANSLATION_APPLICATION_ID: ${TRANSLATION_APPLICATION_ID:-}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      TRANSLATION_XLSX_URL: ${TRANSLATION_XLSX_URL:-}
      CACHE_DIR: "/cache"
      # A single container has nobody to coordinate with, so it is always
      # the primary.
      LEADER_ELECTION: "off"
      PULL_INTERVAL: ${PULL_INTERVAL:-10m}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-30s}
      INITIAL_PULL_DEADLINE: ${INITIAL_PULL_DEADLINE:-45s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LISTEN_ADDR: ${LISTEN_ADDR:-:8080}
    volumes:
      - cacheppuccino_cache:/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/cacheppuccino", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    develop:
      watch:
        - path: .
          action: rebuild

volumes:
  cacheppuccino_cache:
